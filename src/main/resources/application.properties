spring.application.name=student-library-management-system
server.port=7679

# MySQL database propertiesgit add .
spring.datasource.url=jdbc:mysql://localhost:3306/studentlibrarymanagement_db_aug26
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.results.mapping=trace
logging.level.org.hibernate.SQL=debug
